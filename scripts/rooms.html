function assignSpots(want, prev) {
  const out = new Map(), taken = new Set();

    if (p >= 0 && SPOTS[p] && spotGroup(SPOTS[p]) === w.group && !taken.has(p)) { out.set(w.id, p); taken.add(p); }
  }
  for (const w of list) {
    if (out.has(w.id)) continue;
    const mate = list.find(m => m.group === w.group && ideaKey(m.id) === ideaKey(w.id) && out.get(m.id) >= 0);
    const near = mate && SPOTS[out.get(mate.id)];
    let best = -1, bestD = Infinity;
    SPOTS.forEach((s, i) => {
      if (taken.has(i) || spotGroup(s) !== w.group) return;
      const d = near ? Math.abs(s.x - near.x) + Math.abs(s.y - near.y) : i;
      if (d < bestD) { bestD = d; best = i; }

    if (walking()) raf = requestAnimationFrame(frame);
    else { lastTs = 0; timer = setTimeout(() => { timer = 0; raf = requestAnimationFrame(frame); }, 160); }
  }
  function kick() {
    if (raf || still() || !busy()) return;
    clearTimeout(timer);
    timer = 0;
    raf = requestAnimationFrame(frame);
  }
  function stop() { cancelAnimationFrame(raf); clearTimeout(timer); raf = timer = lastTs = 0; }
  function motionChanged() {
    if (still()) { stop(); settle(); }
    pauseBtn.textContent = paused ? "Play" : "Pause";
    pauseBtn.setAttribute("aria-pressed", paused ? "true" : "false");
    draw();
    kick();
  }

  // ---- roster: the same facts as text, and the way to find a sprite ----
  function fillRoster() {
    const list = [...actors.values()].filter(a => !a.leaving).sort((p, q) => p.id < q.id ? -1 : 1);
    const key = JSON.stringify(list.map(a => [a.id, rowCells(a.d)]));
    $("nobody").hidden = list.length > 0;
    if (key === rosterKey) return;
    rosterKey = key;
    const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.id : "";
    roster.replaceChildren();
    for (const a of list) {
      const tr = document.createElement("tr");
      tr.tabIndex = 0;
      tr.dataset.id = a.id;
      tr.classList.toggle("hl", a.id === highlight);
      rowCells(a.d).forEach((cell, i) => {
        const td = document.createElement("td");
        if (i === 1) {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.style.background = a.look.pal.c;
          td.appendChild(chip);
        }
        td.appendChild(document.createTextNode(cell));
        if (i === 2 && a.d.title) td.title = a.d.title;
        tr.appendChild(td);
      });
      const on = () => setHighlight(a.id), off = () => setHighlight("");
      tr.addEventListener("focus", () => { on(); scrollToActor(a.id); });
      tr.addEventListener("mouseenter", on);
      tr.addEventListener("blur", off);
      tr.addEventListener("mouseleave", off);
      roster.appendChild(tr);
      if (a.id === focused) tr.focus();
    }
  }
  function setHighlight(id) {
    if (highlight === id) return;
    highlight = id;
    for (const tr of roster.children) tr.classList.toggle("hl", tr.dataset.id === id);
    draw();
  }
  canvas.addEventListener("mousemove", ev => {
    const lx = ev.offsetX / scale, ly = ev.offsetY / scale;
    let hit = null;
    for (const a of visible().reverse()) {
      if (a.leaving) continue;
      const p = place(a);
      if (lx >= p.x && lx < p.x + p.w && ly >= p.top && ly < p.y + p.h) { hit = a; break; }
    }
    const id = hit ? hit.id : "";
    if (hit) {
      tip.textContent = rowCells(hit.d).join(" · ");
      tip.hidden = false;
      // the tip sits in #wrap's scrolled content
      const w = wrap.getBoundingClientRect(), c = canvas.getBoundingClientRect();
      tip.style.left = Math.min(c.left - w.left + wrap.scrollLeft + ev.offsetX + 14, wrap.scrollLeft + wrap.clientWidth - tip.offsetWidth - 4) + "px";
      tip.style.top = c.top - w.top + wrap.scrollTop + ev.offsetY + 16 + "px";
    } else tip.hidden = true;
    if (id !== hoverId) { hoverId = id; draw(); }
  });
  canvas.addEventListener("mouseleave", () => { tip.hidden = true; if (hoverId) { hoverId = ""; draw(); } });

  // ---- data ----
  function showStatus() { $("status").textContent = [statusText, perfText].filter(Boolean).join(" · "); }
  function shown(ok) {
    statusText = demo ? "demo data" : ok ? "" : "no answer from /api/rooms, retrying";
    showStatus();
    if (ok) $("ts").textContent = new Date().toLocaleTimeString();
  }
  function poll() {
    if (document.hidden) return;
    if (demo) { apply(normalize(demoState(demoStep++, Math.floor(Date.now() / 1000)))); shown(true); return; }
    if (inflight) return;
    inflight = true;
    fetch("/api/rooms", {cache: "no-store"})
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(j => { const data = normalize(j); if (!data) throw new Error("bad shape"); apply(data); shown(true); })
      .catch(() => shown(false))  // keep the last scene
      .finally(() => { inflight = false; });
  }

  pauseBtn.addEventListener("click", () => { paused = !paused; motionChanged(); });
  zoomBtn.addEventListener("click", toggleZoom);
  motion.addEventListener("change", ev => { reduced = ev.matches; motionChanged(); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { stop(); return; }
    settle();  // no replay of walks missed while away
    poll();
    motionChanged();
  });
  window.addEventListener("resize", resize);
  const bg = base.getContext("2d");
  bg.setTransform(S, 0, 0, S, 0, 0);  // the art is written in world px; half px are whole art px
  drawStatic(bg);
  resize();
  watchDpr();
  poll();
  setInterval(poll, 5000);
})();
</script></body></html>
