<script>
"use strict";
// The part up to the end-pure marker touches no DOM or window, so a node test can slice it out and run it.
const T = 32;
// One letter per tile. Walls: # plain, W whiteboard, N window, Q pegboard. A wall shows its face to the floor below it.
// Floor: . floor, + doorway or zone entry, E campus door, , grass, : stone path, _ rug. Work spots: * stage rooms, k kitchen.
// Seats, walkable only as a path's end: c couch, b beanbag, l lounger (j is its backrest), t beach towel (u is its head end).
// Props: P plant, i lamp, U water cooler, C filing cabinet, D desk, T meeting table, R reading table, S bookshelf,
// h armchair, O gas cylinders, H fume hood, G glass cabinet, L lab bench, Z sink, B workbench, J drill press, X crate, F fridge,
// K counter, M coffee machine, I island, Y coffee table, V TV, A arcade, @ umbrella, & tree, % bush, ~ water,
// n sideboard, g lumber stack, q sawhorses with a half-built cabinet.
// Meeting room and library are walled; office, lab, workshop and lounge are open zones on one floor; the pool is outside.
const MAP = [
  "#NN#WWW#N##NN#NN####NN#NN##,,,,,,,,,",
  "#P..*.*.P#................#,,&,%,,&,",
  "#........#.P.......H.*.*G.#&,,,,,,,,",
  "#.*TTTT*.#.DDDDDD..H.LLL..#,,,,,&,,,",
  "#.*TTTT*.#..*.*.*...*LLL*.#P.......P",
  "#n.*..*.n#............*...#jl.~~~.jl",
  "#........#.DDDDDD..LL..OG.#...~~~...",
  "#Phih...P#.C*+*.*..Z.*+.P.#jl.~~~.jl",
  "######++##P..............P#...~~~...",
  "#P........................+.@.~~~.@.",
  "E.........................+...~~~...",
  "#U.........QQQQQ..FKMKKZK.#jl.~~~.jl",
  "######++##..*.*.J..k...k..#...~~~...",
  "#.*...*..#.BBBB.X...IIII.k#jl.~~~.jl",
  "#S.......#......+..k....k+#P...+...P",
  "#S.*RRR*.#..*..*Xi......PA#utut:utut",
  "#S..RRR..#.BBB.BB.ccccc...#%,,,:,,,,",
  "#S..*.*..#.....qq.c_____b.#utut:utut",
  "#S.......#.X.*....c_YY__b.#,,,,:,,,%",
  "#S.hi.hiP#.XXBB.P.c_____..#utut:utut",
  "#P......P#.ggg....P.VVV..P#,,%,:,,,,",
  "###########################,&,,&,,%,",

const MAP_W = MAP[0].length, MAP_H = MAP.length;
const ROOMS = {
  meeting: {name: "Meeting room", x: 1, y: 1, w: 8, h: 7},
  lab: {name: "Lab", x: 19, y: 2, w: 6, h: 6},
  workshop: {name: "Workshop", x: 11, y: 12, w: 6, h: 9},
  library: {name: "Library", x: 1, y: 13, w: 8, h: 8},
  office: {name: "Office", x: 11, y: 2, w: 6, h: 6},
  lounge: {name: "Kitchen-living room", x: 18, y: 11, w: 8, h: 10},
  pool: {name: "Pool", x: 27, y: 4, w: 9, h: 11},
};
const ROOM_KEYS = Object.keys(ROOMS);
const KITCHEN_END = 14;  // lounge rows up to here are the kitchen side
const OPEN_ZONES = ["office", "lab", "workshop", "lounge"];  // drawn as a floor patch, with no walls
// zone names sit inside their zone, on free floor: [text, centre x, centre y] in tiles
const LABELS = [["Meeting room", 5, 6.5], ["Library", 5, 14.3], ["Office", 14, 2.4], ["Lab", 22.5, 7.45],
  ["Workshop", 14, 14.25], ["Kitchen", 19, 13.3], ["Living room", 23, 15.5], ["Pool", 31.5, 4.5]];
const WALK = ".+E*k,_:", SEATS = "cblt", WALLS = "#WNQ";

function tileAt(x, y) { return (MAP[y] || "")[x] || "#"; }
function roomAt(x, y) {
  for (const k of ROOM_KEYS) {
    const r = ROOMS[k];
    if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h) return k;
  }
  return "";
}
const DOORS = [], SPOTS = [];
MAP.forEach((row, y) => [...row].forEach((ch, x) => {
  if (ch === "+" || ch === "E") DOORS.push({x, y, campus: ch === "E"});
  // towels lie on the lawn, south of the pool's rect, but count as pool spots
  if (ch === "*" || ch === "k" || SEATS.includes(ch)) SPOTS.push({x, y, kind: ch, room: ch === "t" ? "pool" : roomAt(x, y)});
}));
const CAMPUS_DOOR = DOORS.find(d => d.campus);
function passable(x, y) { return WALK.includes(tileAt(x, y)); }

// 4-connected BFS; the goal may be a seat, so nobody walks across a couch on the way elsewhere; avoid, if given, is a
// set of tile indices (y * MAP_W + x) to keep off as well
function bfs(sx, sy, gx, gy, avoid) {
  const start = sy * MAP_W + sx, goal = gy * MAP_W + gx, prev = new Map([[start, -1]]), queue = [start];
  for (let i = 0; i < queue.length; i++) {
    const cur = queue[i];
    if (cur === goal) {
      const path = [];
      for (let p = cur; p !== -1; p = prev.get(p)) path.push([p % MAP_W, Math.floor(p / MAP_W)]);
      return path.reverse();
    }
    const cx = cur % MAP_W, cy = Math.floor(cur / MAP_W);
    for (const [dx, dy] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) {
      const nx = cx + dx, ny = cy + dy, n = ny * MAP_W + nx;
      if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H || prev.has(n)) continue;
      if (n !== goal && (!passable(nx, ny) || avoid && avoid.has(n))) continue;
      prev.set(n, cur);
      queue.push(n);
    }
  }
  return null;
}

function spotGroup(s) { return s.room + ":" + (s.kind === "b" ? "c" : s.kind === "t" ? "l" : s.kind); }
function charGroup(c) {
  if (c.room === "pool") return "pool:l";
  if (c.room === "lounge") return c.activity === "wait" ? "lounge:k" : "lounge:c";
  return c.room + ":*";
}
// The idea key: the id without its agent suffix (# and 8 hex digits). A project name may hold a #, so never split at the first one.
function ideaKey(id) { return id.replace(/#[0-9a-f]{8}$/, ""); }
// who gets a kitchen spot first: a permission prompt, then a gate, then any other wait, then the rest
function priority(c) { return c.activity !== "wait" ? 3 : c.note === "permission" ? 0 : c.note ? 1 : 2; }
// want: [{id, group, pri}], prev: Map id -> spot index. Returns Map id -> spot index, -1 when the group is full.
// Spots stick between polls, and a new character takes the free spot nearest someone of its idea.
// A newcomer to a full group takes the spot of its lowest-priority holder, who goes to the overflow.
function assignSpots(want, prev) {
  const out = new Map(), taken = new Set();
  const list = want.slice().sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
  for (const w of list) {
    const p = prev.get(w.id);
    if (p >= 0 && SPOTS[p] && spotGroup(SPOTS[p]) === w.group && !taken.has(p)) { out.set(w.id, p); taken.add(p); }
  }
  const rank = w => w.pri || 0;
  for (const w of list.slice().sort((a, b) => rank(a) - rank(b))) {
    if (out.has(w.id)) continue;
    const mate = list.find(m => m.group === w.group && ideaKey(m.id) === ideaKey(w.id) && out.get(m.id) >= 0);
    const near = mate && SPOTS[out.get(mate.id)];
    let best = -1, bestD = Infinity;
    SPOTS.forEach((s, i) => {
      if (taken.has(i) || spotGroup(s) !== w.group) return;
      const d = near ? Math.abs(s.x - near.x) + Math.abs(s.y - near.y) : i;
      if (d < bestD) { bestD = d; best = i; }
    });
    if (best < 0) {
      let worst = null;
      for (const h of list) if (out.get(h.id) >= 0 && h.group === w.group && rank(h) > rank(w) && (!worst || rank(h) >= rank(worst))) worst = h;
      if (worst) { best = out.get(worst.id); out.set(worst.id, -1); }
    }
    out.set(w.id, best);
    if (best >= 0) taken.add(best);
  }
  return out;
}

const ACTIVITIES = ["work", "wait", "reply", "idle"];
function clip(v, n) { return typeof v === "string" ? v.slice(0, n) : ""; }
// shorten for a tag: at most n characters, the last one an ellipsis when the text was cut
function cut(s, n) { return s.length > n ? s.slice(0, n - 1) + "\u2026" : s; }
function own(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
// the server is trusted, but a bad field must not break the scene
function normalize(j) {
  if (!j || !Array.isArray(j.characters)) return null;
  const seen = new Set(), out = [];
  for (const c of j.characters) {
    if (!c || typeof c.id !== "string" || !c.id || c.id.length > 200 || seen.has(c.id) || out.length >= 300) continue;
    seen.add(c.id);
    out.push({
      id: c.id, kind: c.kind === "agent" ? "agent" : "lead", role: clip(c.role, 40) || "unknown",
      room: own(ROOMS, c.room) ? c.room : "office", activity: ACTIVITIES.includes(c.activity) ? c.activity : "idle",
      project: clip(c.project, 60), idea: clip(c.idea, 80), title: clip(c.title, 160), note: clip(c.note, 60), live: c.live === true,
      says: clip(c.says, 400),
    });
  }
  return {ts: typeof j.ts === "number" ? j.ts : 0, characters: out};
}

// ---- who is in the building: pick = {all, on: Set of idea keys}. A lead whose idea is neither ticked nor live lounges
// at the pool; one that waits on you keeps its wait and note there, so its ! bubble still shows. Nobody is dropped ----
const STORE = "imp-rooms-ideas-v2";  // r2 saved under imp-rooms-ideas, where "all" was the default; that save is ignored
function keep(chars, pick) {
  if (pick.all) return chars;
  return chars.map(c => c.kind !== "lead" || c.live || pick.on.has(ideaKey(c.id)) ? c
    : Object.assign({}, c, {room: "pool", activity: c.activity === "wait" ? "wait" : "idle"}));
}
// saved choice -> pick, or null when the text is missing or not what this page wrote
function parsePick(text) {
  let j;
  try { j = JSON.parse(text); } catch (e) { return null; }
  if (!j || typeof j !== "object" || typeof j.all !== "boolean") return null;
  if (!Array.isArray(j.on) || j.on.length > 500 || !j.on.every(k => typeof k === "string" && k.length <= 200)) return null;
  return {all: j.all, on: new Set(j.on)};
}

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}
function projectColour(p) {
  const hue = (hashStr(p || "?") % 12) * 30;
  return [hslHex(hue, 0.62, 0.56), hslHex(hue, 0.55, 0.4)];
}

// ---- colour ramps: four tones of one colour, darkest first; shades lean cool and lights warm ----
const S = 2;  // art pixels per world pixel: the scene and the sprites are drawn at twice the world grid
function hslHex(h, s, l) {
  const a = s * Math.min(l, 1 - l), f = n => {
    const k = (n + h / 30) % 12;
    return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, "0");
  };
  return "#" + f(0) + f(8) + f(4);
}
function hexHsl(hex) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (!d) return [0, 0, l];
  const h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, d / (1 - Math.abs(2 * l - 1)), l];
}
const RAMPS = new Map();
// [outline, shade, base, light]; the hue moves at most 12 degrees a step (Slynyrd: 20 or less), greys get a cool shade
function ramp(hex) {
  let t = RAMPS.get(hex);
  if (t) return t;
  const [h, s, l] = hexHsl(hex), grey = s < 0.08;
  const toward = (goal, deg) => {
    if (grey) return goal;
    const d = ((goal - h + 540) % 360) - 180;
    return (h + Math.sign(d) * Math.min(Math.abs(d), deg) + 360) % 360;
  };
  t = [hslHex(toward(245, 24), grey ? 0.14 : Math.min(1, s * 0.95), Math.max(0.05, l * 0.48)),
    hslHex(toward(245, 12), grey ? 0.1 : Math.min(1, s * 1.08), Math.max(0.03, l - 0.12)),
    hex, hslHex(toward(55, 10), grey ? 0.08 : s * 0.92, Math.min(0.97, l + 0.1))];
  RAMPS.set(hex, t);
  return t;
}
const ROLE_POSE = {
  chief: "talk", builder: "hammer", "tech-researcher": "read", "business-researcher": "read", researcher: "read",
  "code-investigator": "magnify", "data-analyst": "laptop", verifier: "clipboard", reviewer: "pen", "claim-checker": "pen",
  presenter: "board",
};
function poseFor(c) {
  if (c.room === "pool") return "sunbathe";
  if (c.room === "lounge") return c.activity === "wait" ? "coffee" : hashStr(c.id) % 3 ? "games" : "couch";
  if (c.activity === "reply" || c.activity === "idle") return "stand";
  return own(ROLE_POSE, c.role) ? ROLE_POSE[c.role] : "laptop";
}
function roomText(c) {
  if (c.room === "pool") return "Pool (not ticked)";  // the server sends nobody to the pool: only keep does
  return ROOMS[c.room].name + (c.room === "lounge" ? (c.activity === "wait" ? ", kitchen side" : ", couch side") : "");
}
function stateText(c) {
  if (c.activity === "wait") return "waiting on you" + (c.note ? ": " + c.note : "");
  if (c.activity === "reply") return "replied, your turn";
  if (c.activity === "work") return "working";
  return c.room === "pool" ? "not in the building" : "idle";
}
// the name tag: a lead shows idea and project, an agent its role; one hovered or focused also shows its idea
function tagText(c, hot) {
  if (c.kind === "agent") return cut(c.role, 20) + (hot && c.idea ? " \u00b7 " + cut(c.idea, 18) : "");
  return (c.idea ? cut(c.idea, 18) + " \u00b7 " : "") + cut(c.project || "?", 12);
}
function rowCells(c) { return [c.role, c.project || "-", c.idea || "-", roomText(c), stateText(c)]; }
// name-tag slots, all in device px. Each person: {id, rank, hot, cx, ys, body, labels: [{label, w}], hh}; body is the
// sprite's box, head to feet with its props, and ys the tops of its slots (above the head, under the feet). A tag sits
// centred on cx, at most drift px sideways, on the cw x ch canvas, clear of blocked, of the tags placed before it and of
// every body, and nearer its owner's body than anyone else's. Lower rank picks first. A tag with no slot is null: it shows
// only on hover. A hot one (hovered or focused) still takes the first slot clear of blocked boxes and tags, even over a body,
// or failing that a centred box clamped onto the canvas. A person with no labels is a body only: it blocks, gets no entry.
// prev, the last frame's result, holds a tag to its slot, label and drift while they stay legal, so a walker's tag does not flicker.
function placeTags(people, blocked, cw, ch, gap, drift, prev) {
  const hit = (b, o, m) => o.x < b.x + b.w + m && b.x < o.x + o.w + m && o.y < b.y + b.h + m && b.y < o.y + o.h + m;
  const far = (x, y, o) => Math.hypot(Math.max(o.x - x, 0, x - o.x - o.w), Math.max(o.y - y, 0, y - o.y - o.h));
  const taken = blocked.slice(), out = new Map();
  for (const p of people.slice().sort((m, n) => m.rank - n.rank)) {
    if (!p.labels.length) continue;
    const cands = [], was = prev && prev.get(p.id);
    p.labels.forEach(({label, w}, li) => p.ys.forEach((y, s) => [0, -drift / 2, drift / 2, -drift, drift].forEach(d => {
      const x = Math.max(0, Math.min(cw - w, p.cx - w / 2 + d));
      if (Math.abs(x + w / 2 - p.cx) <= drift) cands.push({x: Math.round(x), y: Math.round(y), w, h: p.hh, label, li, s, d});
    })));
    if (was) cands.sort((m, n) => (m.li !== was.li) - (n.li !== was.li) || (m.s !== was.s) - (n.s !== was.s) || (m.d !== was.d) - (n.d !== was.d));
    const clear = b => b.x >= 0 && b.y >= 0 && b.x + b.w <= cw && b.y + b.h <= ch && !taken.some(o => hit(b, o, gap));
    const mine = b => {
      const x = b.x + b.w / 2, y = b.y + b.h / 2, d = far(x, y, p.body);
      return people.every(q => !hit(b, q.body, 0) && (q === p || far(x, y, q.body) > d));
    };
    const {label, w} = p.labels[0], edge = {x: Math.round(Math.max(0, Math.min(cw - w, p.cx - w / 2))),
      y: Math.round(Math.max(0, Math.min(ch - p.hh, p.ys[0]))), w, h: p.hh, label, li: 0, s: 0, d: 0};
    const b = cands.find(c => clear(c) && mine(c)) || (p.hot ? cands.find(clear) || cands[0] || edge : null);
    out.set(p.id, b || null);
    if (b) taken.push(b);
  }
  return out;
}
// what placeTags found, as drawn: a tag hides at once when its slot turns illegal, but shows again, or in a new slot or
// label, only once placeTags has kept it there for wait ms in a row, so a walker's tag does not blink on and off. since
// maps id to the slot it waits on and when that began. A hot tag, or wait 0 for a still frame, shows at once. Returns the
// drawn map and the ms until the next waiting tag is due (Infinity if none).
function holdTags(tags, since, now, wait, hot) {
  const out = new Map();

      if (!byProject.has(p)) byProject.set(p, []);
      byProject.get(p).push(k);
    }
    for (const [p, list] of byProject) {
      const set = document.createElement("fieldset"), legend = document.createElement("legend");
      legend.textContent = p;
      set.appendChild(legend);
      for (const k of list) {
        const [label, input] = box(k.slice(k.indexOf("/") + 1), titles.get(k));
        input.addEventListener("change", () => changed(() => { if (input.checked) choice.on.add(k); else choice.on.delete(k); }));
        boxes.set(k, input);
        set.appendChild(label);
      }
      body.appendChild(set);
    }
    const note = document.createElement("div");
    note.className = "empty";
    note.textContent = "A live idea is in the building, ticked or not. Saved in this browser for this address only: 127.0.0.1 and localhost keep separate choices.";
    body.appendChild(note);
  }
  // boxes show the choice; with All ticked they are ticked and locked
  function syncChooser(total) {
    allBox.checked = choice.all;
    let on = 0;
    for (const [k, input] of boxes) {
      input.checked = choice.all || choice.on.has(k);
      input.disabled = choice.all;
      if (input.checked) on++;
    }
    $("ideas-sum").textContent = choice.all ? "Ideas: all (" + total + ")" : "Ideas: " + on + " of " + total;
  }
  function refresh() {
    if (!last) return;
    buildChooser(last.characters);
    syncChooser(boxes.size);
    const kept = keep(last.characters, choice), pool = kept.filter(c => c.room === "pool");
    const waiting = pool.filter(c => c.activity === "wait").length;
    apply({ts: last.ts, characters: kept});
    // a wait at the pool or past a full room's spots is counted too, so it is never missed
    const lost = [...actors.values()].filter(a => !a.leaving && a.spot < 0), lw = lost.filter(a => a.d.activity === "wait").length;
    const parts = (pool.length ? [pool.length + " at the pool, " + waiting + " waiting on you"] : []).concat(lost.length ? [lost.length + " not drawn, " + lw + " waiting"] : []);
    $("roster-title").textContent = "Who is where" + (parts.length ? " (" + parts.join("; ") + ")" : "");
  }

  // ---- data ----
  function showStatus() { $("status").textContent = [statusText, perfText].filter(Boolean).join(" · "); }
  function shown(ok) {
    statusText = demo ? "demo data" : ok ? "" : "no answer from /api/rooms, retrying";
    showStatus();
    if (ok) $("ts").textContent = new Date().toLocaleTimeString();
  }
  function poll() {
    if (document.hidden) return;
    if (demo) { last = normalize(demoState(demoStep++, Math.floor(Date.now() / 1000))); refresh(); shown(true); return; }
    if (inflight) return;
    inflight = true;
    fetch("/api/rooms", {cache: "no-store"})
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(j => { const data = normalize(j); if (!data) throw new Error("bad shape"); last = data; refresh(); shown(true); })
      .catch(() => shown(false))  // keep the last scene
      .finally(() => { inflight = false; });
  }

  // ---- the CEO: one tile per key press or held key, on walkable tiles only; talk to the nearest within 1.5 tiles ----
  function ceoStep() {
    const dir = queued.shift() || held, [dx, dy] = STEPS[dir], nx = Math.round(ceo.x) + dx, ny = Math.round(ceo.y) + dy;
    ceo.dir = dir;
    if (!passable(nx, ny)) return false;
    if (still()) { ceo.x = nx; ceo.y = ny; } else ceo.path = [[nx, ny]];
    return true;
  }
  function near() {
    let best = null, bd = 1.5;
    for (const a of actors.values()) {
      if (a.leaving || a.spot < 0) continue;
      const d = Math.hypot(a.x - ceo.x, a.y - ceo.y);
      if (d <= bd) { bd = d; best = a; }
    }
    return best;
  }
  // the speech bubble is a DOM box over the canvas, so two sentences wrap and stay crisp; it closes when you walk off
  function showSay() {
    const a = ceo && talkId ? actors.get(talkId) : null;
    if (!a || a.leaving || a.spot < 0 || Math.hypot(a.x - ceo.x, a.y - ceo.y) > 2.5) {
      talkId = "";
      say.hidden = true;
      return;
    }
    const who = a.d.kind === "agent" ? a.d.role + (a.d.idea ? " \u00b7 " + a.d.idea : "") : "chief \u00b7 " + (a.d.idea || a.d.project || "?");
    const text = a.d.says || "I'm the " + a.d.role + (a.d.idea ? " on " + a.d.idea : "") + ".";
    if (say.dataset.key !== who + "|" + text) {
      say.dataset.key = who + "|" + text;
      const b = document.createElement("b");
      b.textContent = who;
      say.replaceChildren(b, document.createTextNode(text));
    }
    say.hidden = false;
    const p = place(a), x = canvas.offsetLeft + (a.x * T + T / 2) * scale, y = canvas.offsetTop + p.top * scale;
    say.style.left = Math.max(wrap.scrollLeft + 4, Math.min(x - say.offsetWidth / 2, wrap.scrollLeft + wrap.clientWidth - say.offsetWidth - 4)) + "px";
    say.style.top = Math.max(wrap.scrollTop + 4, y - say.offsetHeight - 8) + "px";
  }
  ceoBtn.addEventListener("click", () => {
    ceo = ceo ? null : {id: CEO_D.id, ceo: true, d: CEO_D, x: CAMPUS_DOOR.x, y: CAMPUS_DOOR.y, path: [], dir: "u", walked: 0, spot: -1,
      leaving: false, look: CEO_LOOK, placed: true};
    held = talkId = "";
    queued = [];
    ceoBtn.textContent = ceo ? "Stop walking" : "Walk as CEO";
    ceoBtn.setAttribute("aria-pressed", ceo ? "true" : "false");
    ceoBtn.blur();  // or Space would press the button again instead of talking
    draw();
  });
  document.addEventListener("keydown", ev => {
    if (!ceo || ev.ctrlKey || ev.metaKey || ev.altKey || /^(INPUT|SELECT|TEXTAREA|BUTTON|SUMMARY)$/.test(ev.target.tagName)) return;
    const key = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key, dir = KEYS[key];
    if (dir) {
      ev.preventDefault();  // arrows and Space would scroll the page
      if (ev.repeat) return;  // a held key walks on in step(); auto-repeat would only fill the queue
      held = dir;
      if (still()) { ceoStep(); held = ""; draw(); return; }
      if (ceo.path.length) queued = queued.concat(dir).slice(-3); else ceoStep();  // a tap moves one tile even when the key is up before the next frame
      kick();
    } else if (key === "e" || key === " ") {
      ev.preventDefault();
      const n = near();
      talkId = n && n.id !== talkId ? n.id : "";
      draw();
    } else if (key === "Escape" && talkId) {
      ev.preventDefault();  // this Esc only closes the bubble, not the full window
      talkId = "";
      draw();
    }
  });
  document.addEventListener("keyup", ev => {
    if (KEYS[ev.key.length === 1 ? ev.key.toLowerCase() : ev.key] === held) held = "";
  });
  window.addEventListener("blur", () => { held = ""; });
  // ---- full screen: the campus alone; the browser's Esc leaves it ----
  // where the browser refuses (no API, or not a real click), the campus fills the window instead (.max), and Esc leaves that too
  function fullscreen() { return document.fullscreenElement || document.webkitFullscreenElement || wrap.classList.contains("max"); }
  function fullChanged() {
    fullBtn.textContent = fullscreen() ? "Leave full screen" : "Full screen";
    resize();
  }
  function setMax(on) { wrap.classList.toggle("max", on); fullChanged(); }
  fullBtn.addEventListener("click", () => {
    if (wrap.classList.contains("max")) return setMax(false);
    if (fullscreen()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    const ask = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
    Promise.resolve(ask ? ask.call(wrap) : Promise.reject()).catch(() => setMax(true));
  });
  for (const name of ["fullscreenchange", "webkitfullscreenchange"]) document.addEventListener(name, fullChanged);
  document.addEventListener("keydown", ev => { if (ev.key === "Escape" && wrap.classList.contains("max") && !ev.defaultPrevented) setMax(false); });
  pauseBtn.addEventListener("click", () => { paused = !paused; motionChanged(); });
  zoomBtn.addEventListener("click", toggleZoom);
  motion.addEventListener("change", ev => { reduced = ev.matches; motionChanged(); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { stop(); return; }
    settle();  // no replay of walks missed while away
    poll();
    motionChanged();
  });
  window.addEventListener("resize", resize);
  const bg = base.getContext("2d");
  bg.setTransform(S, 0, 0, S, 0, 0);  // the art is written in world px; half px are whole art px
  drawStatic(bg);
  for (const k of "DTR") {
    const c = OVER[k] = document.createElement("canvas"), g = c.getContext("2d");
    c.width = c.height = T * S;
    g.setTransform(S, 0, 0, S, 0, 0);
    if (k === "D") officeChair(painter(g, 0, 0).a, true); else seatChair(painter(g, 0, 0).a, "N", k, true);
  }
  // shortcut: a tall prop is drawn again whole, cut to 48 world px above its tile; a prop taller than that loses its top in front
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    if (!"PSFAGCOJH&@iU".includes(tileAt(x, y)) || tileAt(x, y - 1) === "H") continue;
    const c = document.createElement("canvas"), g = c.getContext("2d");
    c.width = (T + 32) * S;
    c.height = 50 * S;
    g.setTransform(S, 0, 0, S, -(x * T - 16) * S, -(y * T - 48) * S);
    drawThing(g, x, y);
    FORE.push({c, x: x * T - 16, y: y * T - 48, ty: y});
  }
  resize();
  watchDpr();
  poll();
  setInterval(poll, 5000);
})();
</script></body></html>
