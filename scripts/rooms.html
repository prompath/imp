<script>
"use strict";
// The part up to the end-pure marker touches no DOM or window, so a node test can slice it out and run it.
const T = 32;
// One letter per tile. Walls: # plain, W whiteboard, N window, Q pegboard. A wall shows its face to the floor below it.
// Floor: . floor, + doorway or zone entry, E campus door, , grass, : stone path, _ rug. Work spots: * stage rooms, k kitchen.
// Seats, walkable only as a path's end: c couch, b beanbag, l lounger (j is its backrest).
// Props: P plant, i lamp, U water cooler, C filing cabinet, D desk, T meeting table, R reading table, S bookshelf,

// K counter, M coffee machine, I island, Y coffee table, V TV, A arcade, @ umbrella, & tree, % bush, ~ water.

  "#S..*.*..#........c_____b.#,,%,,:,,,",
  "#S.......#.X.*....c_YY__b.#,,,,,:,&,",
  "#S.h..h.P#.XX...P.c_____..#&,,,,:,,,",
  "#P.i..i.P#........P.VVV..P#,,%,,,,,&",

const MAP_W = MAP[0].length, MAP_H = MAP.length;
const ROOMS = {
  meeting: {name: "Meeting room", x: 1, y: 1, w: 8, h: 7},
  lab: {name: "Lab", x: 19, y: 2, w: 6, h: 6},
  workshop: {name: "Workshop", x: 11, y: 12, w: 6, h: 9},
  library: {name: "Library", x: 1, y: 13, w: 8, h: 8},

const KITCHEN_END = 14;  // lounge rows up to here are the kitchen side

// zone names float on the floor: [text, centre x, centre y] in tiles
const LABELS = [["Meeting room", 5, 9.5], ["Library", 5, 11.5], ["Office", 14, 1.5], ["Lab", 22, 1.5],
  ["Workshop", 14, 10.5], ["Kitchen", 22, 10.5], ["Living room", 23, 15.5], ["Pool", 31.5, 3.5]];
const WALK = ".+E*k,_:", SEATS = "cbl", WALLS = "#WNQ";

function tileAt(x, y) { return (MAP[y] || "")[x] || "#"; }
function roomAt(x, y) {
  for (const k of ROOM_KEYS) {
    const r = ROOMS[k];
    if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h) return k;
  }
  return "";
}
const DOORS = [], SPOTS = [];
MAP.forEach((row, y) => [...row].forEach((ch, x) => {
  if (ch === "+" || ch === "E") DOORS.push({x, y, campus: ch === "E"});
  if (ch === "*" || ch === "k" || SEATS.includes(ch)) SPOTS.push({x, y, kind: ch, room: roomAt(x, y)});
}));
const CAMPUS_DOOR = DOORS.find(d => d.campus);
function passable(x, y) { return WALK.includes(tileAt(x, y)); }

// 4-connected BFS; the goal may be a seat, so nobody walks across a couch on the way elsewhere
function bfs(sx, sy, gx, gy) {
  const start = sy * MAP_W + sx, goal = gy * MAP_W + gx, prev = new Map([[start, -1]]), queue = [start];
  for (let i = 0; i < queue.length; i++) {
    const cur = queue[i];
    if (cur === goal) {
      const path = [];
      for (let p = cur; p !== -1; p = prev.get(p)) path.push([p % MAP_W, Math.floor(p / MAP_W)]);
      return path.reverse();
    }
    const cx = cur % MAP_W, cy = Math.floor(cur / MAP_W);
    for (const [dx, dy] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) {
      const nx = cx + dx, ny = cy + dy, n = ny * MAP_W + nx;
      if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H || prev.has(n)) continue;
      if (n !== goal && !passable(nx, ny)) continue;
      prev.set(n, cur);
      queue.push(n);
    }
  }
  return null;
}

function spotGroup(s) { return s.room + ":" + (s.kind === "b" ? "c" : s.kind); }
function charGroup(c) {
  if (c.room === "pool") return "pool:l";
  if (c.room === "lounge") return c.activity === "wait" ? "lounge:k" : "lounge:c";
  return c.room + ":*";
}
function ideaKey(id) { return id.split("#")[0]; }
// want: [{id, group}], prev: Map id -> spot index. Returns Map id -> spot index, -1 when the group is full.
// Spots stick between polls, and a new character takes the free spot nearest someone of its idea.
function assignSpots(want, prev) {
  const out = new Map(), taken = new Set();
  const list = want.slice().sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
  for (const w of list) {
    const p = prev.get(w.id);
    if (p >= 0 && SPOTS[p] && spotGroup(SPOTS[p]) === w.group && !taken.has(p)) { out.set(w.id, p); taken.add(p); }
  }
  for (const w of list) {
    if (out.has(w.id)) continue;
    const mate = list.find(m => m.group === w.group && ideaKey(m.id) === ideaKey(w.id) && out.get(m.id) >= 0);
    const near = mate && SPOTS[out.get(mate.id)];
    let best = -1, bestD = Infinity;
    SPOTS.forEach((s, i) => {
      if (taken.has(i) || spotGroup(s) !== w.group) return;
      const d = near ? Math.abs(s.x - near.x) + Math.abs(s.y - near.y) : i;
      if (d < bestD) { bestD = d; best = i; }
    });
    out.set(w.id, best);
    if (best >= 0) taken.add(best);
  }
  return out;
}

const ACTIVITIES = ["work", "wait", "reply", "idle"];
function clip(v, n) { return typeof v === "string" ? v.slice(0, n) : ""; }
function own(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
// the server is trusted, but a bad field must not break the scene
function normalize(j) {
  if (!j || !Array.isArray(j.characters)) return null;
  const seen = new Set(), out = [];
  for (const c of j.characters) {
    if (!c || typeof c.id !== "string" || !c.id || c.id.length > 200 || seen.has(c.id) || out.length >= 300) continue;
    seen.add(c.id);
    out.push({
      id: c.id, kind: c.kind === "agent" ? "agent" : "lead", role: clip(c.role, 40) || "unknown",
      room: own(ROOMS, c.room) ? c.room : "office", activity: ACTIVITIES.includes(c.activity) ? c.activity : "idle",
      project: clip(c.project, 60), idea: clip(c.idea, 80), title: clip(c.title, 160), note: clip(c.note, 60),
    });
  }
  return {ts: typeof j.ts === "number" ? j.ts : 0, characters: out};
}

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}
function projectColour(p) {
  const hue = (hashStr(p || "?") % 12) * 30;
  return ["hsl(" + hue + ",62%,56%)", "hsl(" + hue + ",55%,40%)"];
}
const ROLE_POSE = {
  chief: "talk", builder: "hammer", "tech-researcher": "read", "business-researcher": "read", researcher: "read",
  "code-investigator": "magnify", "data-analyst": "laptop", verifier: "clipboard", reviewer: "pen", "claim-checker": "pen",
  presenter: "board",
};
function poseFor(c) {
  if (c.room === "pool") return "sunbathe";
  if (c.room === "lounge") return c.activity === "wait" ? "coffee" : hashStr(c.id) % 3 ? "games" : "couch";
  if (c.activity === "reply" || c.activity === "idle") return "stand";
  return own(ROLE_POSE, c.role) ? ROLE_POSE[c.role] : "laptop";
}
function roomText(c) {
  return ROOMS[c.room].name + (c.room === "lounge" ? (c.activity === "wait" ? ", kitchen side" : ", couch side") : "");
}
function stateText(c) {
  if (c.activity === "wait") return "waiting on you: " + (c.note || "you");
  if (c.activity === "reply") return "replied, your turn";
  if (c.activity === "work") return "working";
  return c.room === "pool" ? "backlog" : "idle";
}
function rowCells(c) { return [c.role, c.project || "-", c.idea || "-", roomText(c), stateText(c)]; }

// ---- sprites: palette-letter grids built from rects, then outlined; "." is see-through ----
// e eyes; h/H hair, s/S skin, c/C shirt (project colour), p/P trousers come from the character; v is steam (no outline)
const PAL = {
  o: "#2a2233", e: "#231d2b", w: "#fbfaf5", u: "#efe6cf", g: "#c4c8d0", G: "#8b919d", d: "#4c5160", k: "#1d1f26",
  b: "#c08a52", B: "#7d5332", r: "#e2463e", R: "#9a2c2c", y: "#f6d04b", l: "#a3dcff", L: "#3c7bd1", n: "#5db35a",
  f: "#3a2c28", m: "#9c4a3c", q: "#f0a5a0", v: "#e6e9ee",
};
function grid(w, h) { return Array.from({length: h}, () => Array(w).fill(".")); }
// rects are [letter, x, y, w, h], shifted by (ox, oy)
function paint(gr, rects, ox, oy) {
  for (const [k, x, y, w = 1, h = 1] of rects)
    for (let j = y + oy; j < y + oy + h; j++) for (let i = x + ox; i < x + ox + w; i++)
      if (gr[j] && i >= 0 && i < gr[j].length) gr[j][i] = k;
}
// a one-pixel dark outline around everything drawn, so sprites read on any floor
function outline(gr) {
  const solid = (x, y) => gr[y] !== undefined && gr[y][x] !== undefined && gr[y][x] !== "." && gr[y][x] !== "v";
  const edge = [];
  gr.forEach((row, y) => row.forEach((ch, x) => {
    if (ch === "." && (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1))) edge.push([x, y]);
  }));
  for (const [x, y] of edge) gr[y][x] = "o";
}
const HEAD = {
  d: [["h", 11, 8, 10, 1], ["h", 10, 9, 12, 1], ["h", 9, 10, 14, 4], ["H", 21, 10, 1, 4], ["s", 10, 14, 12, 8],

function person(dir, f, o) {

const HAMMER_UP = [["c", 23, 19, 2, 5], ["s", 23, 16, 2, 3], ["B", 24, 7, 1, 9], ["G", 21, 5, 6, 3], ["g", 21, 5, 6, 1]];

        overflow.set(g, (overflow.get(g) || 0) + 1);
        a.x = CAMPUS_DOOR.x; a.y = CAMPUS_DOOR.y; a.path = []; a.placed = true;
        continue;
      }
      if (!a.placed) { a.x = SPOTS[s].x; a.y = SPOTS[s].y; a.placed = true; }
      else if (moved || !a.path.length && (a.x !== SPOTS[s].x || a.y !== SPOTS[s].y) && !wanders(a)) goTo(a, SPOTS[s].x, SPOTS[s].y);
    }
    loaded = true;
    fillRoster();
    kick();
    draw();
  }
  function wanders(a) { return a.d.role === "chief" && a.d.activity === "work" && a.d.room !== "lounge" && a.d.room !== "pool"; }
  // WALK while a path is left, WORK at a spot while live work goes on, IDLE otherwise
  function stateOf(a) { return a.path.length ? "walk" : a.spot >= 0 && a.d.activity === "work" ? "work" : "idle"; }
  function busy() {
    for (const a of actors.values()) if (stateOf(a) !== "idle") return true;
    return false;
  }
  function walking() {
    for (const a of actors.values()) if (a.path.length) return true;
    return false;
  }
  function step(dt, now) {
    let moved = false;
    for (const a of [...actors.values()]) {
      if (!a.path.length) {
        // the chief walks and talks around its room between rests
        if (a.spot >= 0 && wanders(a) && now > a.wanderAt) {
          const h = home(a), atHome = a.x === h.x && a.y === h.y, r = ROOMS[a.d.room];
          let gx = h.x, gy = h.y;
          if (atHome) for (let i = 0; i < 12; i++) {
            const tx = r.x + Math.floor(Math.random() * r.w), ty = r.y + Math.floor(Math.random() * r.h);
            if (tileAt(tx, ty) === "." && Math.abs(tx - h.x) + Math.abs(ty - h.y) <= 4) { gx = tx; gy = ty; break; }
          }
          a.wanderAt = now + 1500 + Math.random() * 3500;
          if (gx !== a.x || gy !== a.y) goTo(a, gx, gy);
        }
        continue;
      }
      const [nx, ny] = a.path[0], dx = nx - a.x, dy = ny - a.y, dist = Math.abs(dx) + Math.abs(dy), go = SPEED * dt;
      if (dist > 0) a.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "r" : "l") : (dy > 0 ? "d" : "u");
      if (dist <= go) { a.x = nx; a.y = ny; a.path.shift(); a.walked += dist; }
      else { a.x += Math.sign(dx) * Math.min(go, Math.abs(dx)); a.y += Math.sign(dy) * Math.min(go, Math.abs(dy)); a.walked += go; }
      moved = true;
      if (!a.path.length) {
        a.dir = "d";
        if (a.leaving) actors.delete(a.id);
      }
    }
    return moved;
  }
  // snap everyone to where they are going: used for reduced motion, Pause and a returning tab
  function settle() {
    for (const a of [...actors.values()]) {
      if (a.leaving) { actors.delete(a.id); continue; }
      const h = home(a);
      if (h) { a.x = h.x; a.y = h.y; }
      a.path = [];
      a.dir = "d";
    }
  }
  function visible() {
    return [...actors.values()].filter(a => a.spot >= 0 || a.leaving).sort((p, q) => p.y - q.y || p.x - q.x);
  }
  function frameOf(a) {
    const st = stateOf(a);
    if (st === "walk") return {pose: "walk", frame: [0, 1, 0, 2][Math.floor(a.walked * 4) % 4], dir: a.dir};
    return {pose: poseFor(a.d), frame: st === "work" && !still() ? tick % 2 : 0, dir: "d"};
  }
  function place(a) {
    const f = frameOf(a), s = sprite(a, f.pose, f.frame, f.dir);
    // feet stand 3 px above the tile's bottom edge; a lying sprite fills its tile
    const x = Math.round(a.x * T + T / 2 - s.ax), y = Math.round(a.y * T + T - s.c.height + (s.lie ? 0 : 1));
    return {f, s, x, y, w: s.c.width, h: s.c.height, top: y + s.top};
  }

  // ---- drawing: boxes in device pixels; u is one CSS pixel ----
  function text(size, weight) { ctx.font = (weight || 500) + " " + Math.round(size * px / scale) + "px system-ui, sans-serif"; }
  // boxes keep a 2 px gap, which also covers the bubbles' 1 px outline
  function hits(b, list) {
    const m = 2 * Math.max(1, Math.round(px / scale));
    return list.some(o => o.x < b.x + b.w + m && b.x < o.x + o.w + m && o.y < b.y + b.h + m && b.y < o.y + o.h + m);
  }
  function fits(b) { return b.x >= 0 && b.y >= 0 && b.x + b.w <= canvas.width && b.y + b.h <= canvas.height; }
  // the first candidate box that stays on the canvas and clear of everything taken
  function pick(cands, taken) { return cands.find(b => fits(b) && !hits(b, taken)); }
  // a small dark pill centred above the head; if that spot is taken it stacks upward, then tries under the feet
  function tagBoxes(cx, top, bottom, label) {
    text(11, 600);
    const u = px / scale, w = Math.ceil(ctx.measureText(label).width + 22 * u), hh = Math.round(16 * u);
    const X = Math.round(Math.max(0, Math.min(canvas.width - w, cx * px - w / 2))), Y = Math.round(top * px - hh - 3 * u);
    return [Y, Y - hh - 2 * u, Y - 2 * hh - 4 * u, Math.round(bottom * px + 2 * u)].map(y => ({x: X, y: Math.round(y), w, h: hh}));
  }
  function drawTag(b, label, chip, hot) {
    const u = px / scale;
    ctx.fillStyle = hot ? "rgba(224,123,0,.95)" : "rgba(24,22,32,.84)";
    roundBox(ctx, b.x, b.y, b.w, b.h);
    if (chip) { ctx.fillStyle = chip; ctx.beginPath(); ctx.arc(b.x + 8 * u, b.y + b.h / 2, 3 * u, 0, 7); ctx.fill(); }
    text(11, 600);
    ctx.fillStyle = "#f4f4f6";
    ctx.textBaseline = "middle";
    ctx.fillText(label, b.x + (chip ? 14 : 8) * u, b.y + b.h / 2 + u / 2);
  }
  // a pixel speech bubble beside the head: right or left, then one step up, one down, two up; the box includes its tail
  function bubbleBoxes(cx, top, label, dots) {
    text(12, 700);
    const u = Math.max(1, Math.round(px / scale)), w = dots ? 17 * u : Math.ceil(ctx.measureText(label).width + 12 * u), hh = 17 * u;
    const right = Math.round((cx + 10) * px), left = Math.round((cx - 10) * px - w), y0 = Math.round((top + 1) * px - hh);
    const out = [];
    for (const k of [0, 1, -1, 2]) for (const [x, side] of [[right, 0], [left, 1]]) out.push({x, y: y0 - k * (hh + 6 * u), w, h: hh + 3 * u, side});
    return out;
  }
  function drawBubble(b, mark, note, colour, dots) {
    const u = Math.max(1, Math.round(px / scale)), h = b.h - 3 * u, tx = b.side ? b.x + b.w - 6 * u : b.x + 3 * u;
    ctx.fillStyle = "#2a2233";
    ctx.fillRect(b.x - u, b.y - u, b.w + 2 * u, h + 2 * u);
    ctx.fillRect(tx - u, b.y + h, 5 * u, 3 * u);
    ctx.fillStyle = "#fbfaf6";
    ctx.fillRect(b.x, b.y, b.w, h);
    ctx.fillRect(tx, b.y + h - u, 3 * u, 3 * u);
    if (dots) {
      ctx.fillStyle = colour;
      for (let i = 0; i < dots; i++) ctx.fillRect(b.x + (3 + i * 4) * u, b.y + 7 * u, 3 * u, 3 * u);
      return;
    }
    text(12, 700);
    ctx.textBaseline = "middle";
    ctx.fillStyle = colour;
    ctx.fillText(mark, b.x + 6 * u, b.y + h / 2 + u);
    if (note) { ctx.fillStyle = "#2a2233"; ctx.fillText(" " + note, b.x + 6 * u + ctx.measureText(mark).width, b.y + h / 2 + u); }
  }
  function draw() {
    if (!backdrop.width) return;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(backdrop, 0, 0);
    const list = visible(), placed = list.map(a => [a, place(a)]);
    for (const [a, p] of placed) {
      if (a.id === highlight || a.id === hoverId) {
        ctx.fillStyle = "rgba(255,152,48,.7)";
        roundBox(ctx, Math.round((a.x * T + 4) * px), Math.round((a.y * T + 25) * px), 24 * px, 6 * px);
      }
      if (p.s.flip) {
        ctx.save();
        ctx.translate((p.x + p.w) * px, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(p.s.c, 0, p.y * px, p.w * px, p.h * px);
        ctx.restore();
      } else ctx.drawImage(p.s.c, p.x * px, p.y * px, p.w * px, p.h * px);
    }
    // nothing drawn below may cover a zone label or another tag or bubble
    const taken = labelBoxes.slice(), shown = placed.filter(([a]) => !a.leaving);
    // shortcut: a room shows only as many characters as it has spots and then a "+k" sign, add spots when rooms overflow often
    for (const [g, k] of overflow) {
      const s = SPOTS.filter(sp => spotGroup(sp) === g);
      if (!s.length) continue;
      const x = Math.max(...s.map(sp => sp.x)), y = Math.min(...s.map(sp => sp.y));
      const b = pick(tagBoxes(x * T + T / 2, y * T + 6, y * T + T, "+" + k), taken);
      if (b) { drawTag(b, "+" + k, "", true); taken.push(b); }
    }
    for (const [a, p] of shown) {
      const cx = a.x * T + T / 2, wait = a.d.activity === "wait", reply = a.d.activity === "reply";
      if (!wait && !reply) continue;
      const note = wait ? a.d.note || "you" : "", cands = bubbleBoxes(cx, p.top, wait ? "! " + note : "?", 0);
      // a bubble must stay readable: when the crowd leaves no clear spot, it may cover tags but never a label
      const b = pick(cands, taken) || cands.find(c => fits(c) && !hits(c, labelBoxes)) || cands[0];
      drawBubble(b, wait ? "!" : "?", note, wait ? "#e07b00" : "#3871dc");
      taken.push(b);
    }
    // a name tag on everyone: idea and project on a lead, the role on an agent; one with no clear spot shows on hover or roster focus
    const order = (a) => a.id === highlight || a.id === hoverId ? 0 : a.d.kind === "lead" ? 1 : 2;
    for (const [a, p] of shown.slice().sort((m, n) => order(m[0]) - order(n[0]))) {
      const hot = a.id === highlight || a.id === hoverId;
      const label = a.d.kind === "agent" ? a.d.role.slice(0, 20)
        : (a.d.idea ? a.d.idea.slice(0, 18) + " · " : "") + (a.d.project || "?").slice(0, 12);
      const cands = tagBoxes(a.x * T + T / 2, p.top, p.y + p.h, label), b = pick(cands, taken) || (hot ? cands[0] : null);
      if (!b) continue;
      drawTag(b, label, a.look.pal.c, hot);
      taken.push(b);
    }
    for (const [a, p] of shown) {
      if (!wanders(a)) continue;  // the chief's talk dots are decoration: only where there is room
      const b = pick(bubbleBoxes(a.x * T + T / 2, p.top, "", 1), taken);
      if (b) { drawBubble(b, "", "", "#2a2233", still() ? 3 : 1 + tick % 3); taken.push(b); }
    }
  }
  function frame(ts) {
    raf = 0;
    const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0;
    lastTs = ts;
    const moved = step(dt, ts), t = Math.floor(ts / 160);
    if (moved || t !== tick) { tick = t; draw(); }
    if (!busy() || still()) { lastTs = 0; return; }
    // full frame rate only while someone walks; work poses need one frame per 160 ms tick
    if (walking()) raf = requestAnimationFrame(frame);
    else { lastTs = 0; timer = setTimeout(() => { timer = 0; raf = requestAnimationFrame(frame); }, 160); }
  }
  function kick() {
    if (raf || still() || !busy()) return;
    clearTimeout(timer);
    timer = 0;
    raf = requestAnimationFrame(frame);
  }
  function stop() { cancelAnimationFrame(raf); clearTimeout(timer); raf = timer = lastTs = 0; }
  function motionChanged() {
    if (still()) { stop(); settle(); }
    pauseBtn.textContent = paused ? "Play" : "Pause";
    pauseBtn.setAttribute("aria-pressed", paused ? "true" : "false");
    draw();
    kick();
  }

  // ---- roster: the same facts as text, and the way to find a sprite ----
  function fillRoster() {
    const list = [...actors.values()].filter(a => !a.leaving).sort((p, q) => p.id < q.id ? -1 : 1);
    const key = JSON.stringify(list.map(a => [a.id, rowCells(a.d)]));
    $("nobody").hidden = list.length > 0;
    if (key === rosterKey) return;
    rosterKey = key;
    const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.id : "";
    roster.replaceChildren();
    for (const a of list) {
      const tr = document.createElement("tr");
      tr.tabIndex = 0;
      tr.dataset.id = a.id;
      tr.classList.toggle("hl", a.id === highlight);
      rowCells(a.d).forEach((cell, i) => {
        const td = document.createElement("td");
        if (i === 1) {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.style.background = a.look.pal.c;
          td.appendChild(chip);
        }
        td.appendChild(document.createTextNode(cell));
        if (i === 2 && a.d.title) td.title = a.d.title;
        tr.appendChild(td);
      });
      const on = () => setHighlight(a.id), off = () => setHighlight("");
      tr.addEventListener("focus", on);
      tr.addEventListener("mouseenter", on);
      tr.addEventListener("blur", off);
      tr.addEventListener("mouseleave", off);
      roster.appendChild(tr);
      if (a.id === focused) tr.focus();
    }
  }
  function setHighlight(id) {
    if (highlight === id) return;
    highlight = id;
    for (const tr of roster.children) tr.classList.toggle("hl", tr.dataset.id === id);
    draw();
  }
  canvas.addEventListener("mousemove", ev => {
    const lx = ev.offsetX / scale, ly = ev.offsetY / scale;
    let hit = null;
    for (const a of visible().reverse()) {
      if (a.leaving) continue;
      const p = place(a);
      if (lx >= p.x && lx < p.x + p.w && ly >= p.top && ly < p.y + p.h) { hit = a; break; }
    }
    const id = hit ? hit.id : "";
    if (hit) {
      tip.textContent = rowCells(hit.d).join(" · ");
      tip.hidden = false;
      const wrap = canvas.parentElement.getBoundingClientRect(), c = canvas.getBoundingClientRect();
      tip.style.left = Math.min(c.left - wrap.left + ev.offsetX + 14, wrap.width - tip.offsetWidth - 4) + "px";
      tip.style.top = c.top - wrap.top + ev.offsetY + 16 + "px";
    } else tip.hidden = true;
    if (id !== hoverId) { hoverId = id; draw(); }
  });
  canvas.addEventListener("mouseleave", () => { tip.hidden = true; if (hoverId) { hoverId = ""; draw(); } });

  // ---- data ----
  function shown(ok) {
    $("status").textContent = demo ? "demo data" : ok ? "" : "no answer from /api/rooms, retrying";
    if (ok) $("ts").textContent = new Date().toLocaleTimeString();
  }
  function poll() {
    if (document.hidden) return;
    if (demo) { apply(normalize(demoState(demoStep++, Math.floor(Date.now() / 1000)))); shown(true); return; }
    if (inflight) return;
    inflight = true;
    fetch("/api/rooms", {cache: "no-store"})
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(j => { const data = normalize(j); if (!data) throw new Error("bad shape"); apply(data); shown(true); })
      .catch(() => shown(false))  // keep the last scene
      .finally(() => { inflight = false; });
  }

  pauseBtn.addEventListener("click", () => { paused = !paused; motionChanged(); });
  motion.addEventListener("change", ev => { reduced = ev.matches; motionChanged(); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { stop(); return; }
    settle();  // no replay of walks missed while away
    poll();
    motionChanged();
  });
  window.addEventListener("resize", resize);
  drawStatic(base.getContext("2d"));
  resize();
  poll();
  setInterval(poll, 5000);
})();
</script></body></html>
